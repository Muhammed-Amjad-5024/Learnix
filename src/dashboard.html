<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Learnix</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="dashboard-header">

        <div>
            <h1>Learnix</h1>
            <p>Institution Admin Dashboard</p>
        </div>

        <button
            id="logout-button"
            class="logout-button"
            type="button"
        >
            Log out
        </button>

    </header>


    <main class="dashboard-container">

        <!-- Welcome section -->
        <section class="dashboard-welcome">

            <h2 id="welcome-message">
                Welcome
            </h2>

            <p id="institution-name">
                Loading institution...
            </p>

        </section>


        <!-- Dashboard statistics -->
        <section class="dashboard-cards">

            <div class="dashboard-card">
                <h3>Students</h3>
                <p id="student-count">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Faculty</h3>
                <p id="faculty-count">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Classrooms</h3>
                <p id="classroom-count">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Subjects</h3>
                <p id="subject-count">0</p>
            </div>

        </section>


        <!-- Classrooms -->
        <section class="dashboard-section">

            <div class="section-header">

                <h2>Classrooms</h2>

                <button
                    id="create-classroom-button"
                    type="button"
                >
                    + Create Classroom
                </button>

            </div>


            <div id="classroom-list">
                <p>Loading classrooms...</p>
            </div>

        </section>


        <!-- Create Classroom -->
        <section
            id="create-classroom-section"
            class="dashboard-section"
            hidden
        >

            <h2>Create Classroom</h2>


            <form id="create-classroom-form">

                <div class="form-group">

                    <label for="classroom-name">
                        Classroom Name
                    </label>

                    <input
                        type="text"
                        id="classroom-name"
                        name="classroom-name"
                        placeholder="Example: CSE S6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="classroom-description">
                        Description
                    </label>

                    <textarea
                        id="classroom-description"
                        name="classroom-description"
                        placeholder="Enter classroom description"
                        rows="4"
                    ></textarea>

                </div>


                <button type="submit">
                    Create Classroom
                </button>

                <p id="classroom-message"></p>

            </form>

        </section>

    </main>


    <script type="module" src="js/dashboard.js"></script>

</body>
</html>
